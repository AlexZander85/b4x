# FB-31 (b4x-cka): Causal eligibility matrix — failure family -> candidate family.
#
# Canonical machine-readable mapping for guided search / transport fallback:
# every hypothesis/evidence failure family declares which candidate families
# are eligible, which are forbidden, which narrower families are mandatory,
# which prerequisites/controls/target validations apply, and whether scoped
# transport (WARP/SOCKS/TUN) may be authorized at all — and with which
# minimum evidence authority (FB-30 levels).
#
# Normative source: B4X_POST_V23_ADAPTIVE_BLOCKING_DETECTOR_AND_GUIDED_
# STRATEGY_SEARCH_ADDENDUM_v1.2.md §21 (hypothesis-to-search mapping),
# §20.1/§20.2 (SearchPrior allowed/forbidden effects), FB-14 §10/§13
# (unhealthy controls block; provisional hints never authorize transport),
# FB-30 (evidence authority levels).
#
# Safety rules encoded here:
#   * scoped transport (WARP/SOCKS/TUN) is eligible ONLY as
#     transport_authorization: scoped-eligible-to-test with
#     required_evidence_authority >= authoritative-abd; DNS-only, QUIC-only
#     and single-timeout families are always transport_authorization: none
#     (broad WARP escalation blocked — FB-31 acceptance criterion).
#   * provisional hints may reorder/boost search, never authorize transport.
#   * forbidden candidate families can never be promoted by a hint.

schema_version: "1.0"
declared_total: 9

# --- Candidate family catalog -----------------------------------------------
# kind: eligible | shadow | forbidden  (forbidden families can never be
# selected; shadow families are probe-only and never production candidates)
candidate_families:
