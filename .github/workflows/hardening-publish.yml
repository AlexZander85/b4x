name: RST GSO hardening stage publisher

on:
  pull_request:
    branches:
      - hardening-publisher-20260730
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publisher controls
        uses: actions/checkout@v4
        with:
          ref: hardening-publisher-20260730
          path: publisher

      - name: Checkout hardening staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/rst-gso-hardening-staging
          fetch-depth: 0
          path: work

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: work/src/go.sum

      - name: Apply one hardening stage
        shell: bash
        run: |
          set -euo pipefail
          cat \
            publisher/.hardening/payload.00 \
            publisher/.hardening/payload.01 \
            publisher/.hardening/payload.02a \
            publisher/.hardening/payload.02b \
            publisher/.hardening/payload.03 \
            publisher/.hardening/payload.04 \
            > /tmp/hardening-stage.b64
          base64 -d /tmp/hardening-stage.b64 > /tmp/hardening-stage.patch
          echo "$(cat publisher/.hardening/payload.sha256)  /tmp/hardening-stage.patch" | sha256sum -c -
          cd work
          git config user.name "OpenAI Agent"
          git config user.email "344792@gmail.com"
          git am --3way /tmp/hardening-stage.patch
          test "$(git log -1 --pretty=%s)" = "$(cat ../publisher/.hardening/subject.txt)"

      - name: Go unit and integration gate
        working-directory: work/src
        run: >-
          go test
          ./classifier ./nfq ./config ./action ./routing ./crossservice
          ./sni ./observability ./diagnostics ./runtimecontrol ./http/handler

      - name: Race gate
        working-directory: work/src
        run: go test -race ./classifier ./nfq

      - name: Reassembly fuzz smoke
        working-directory: work/src
        run: go test ./classifier -run=^$ -fuzz=FuzzTCPReassemblyNeverPanics -fuzztime=2s

      - name: Push green stage
        working-directory: work
        run: git push origin HEAD:refs/heads/agent/rst-gso-hardening-staging
