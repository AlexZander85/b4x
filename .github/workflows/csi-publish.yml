name: Publish CSI stages

on:
  push:
    branches:
      - csi-publisher-20260729-v2
  pull_request:
    branches:
      - csi-publisher-20260729-v2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/classifier-v2.3-capture-envelope
          fetch-depth: 0

      - name: Set up project Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Reconstruct, fixup, test and publish ten CSI commits
        shell: bash
        run: |
          set -euo pipefail
          readonly base=8325bb4efe191aad274b46330e75d5272178c035
          git config user.name "b4-csi-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin csi-publisher-20260729-v2

          : > /tmp/csi-patches.b64
          failed=0
          for part in $(seq -w 0 16); do
            case "$part" in
              00) expected=c6d675d00411f4867181a92710e35262367d549ba1efc698ac4739563c6e192b ;;
              01) expected=ea379b4b9a38a9e17db26930f476dbafb79d9ff2ecb2bd12008a9539a4b990f9 ;;
              02) expected=799371d069e82771aea51696f4b74af1e886f3eb9d4c9b5f29d5ebd2130a570d ;;
              03) expected=024624c559ce982b1a654b699bd0a7ba52043ddc5970fdefaaeba970a33928e5 ;;
              04) expected=d9eb4105e3fdbd270ebe777fbbd56bed7ebaef953e147dd5079aedc80bc7f7ca ;;
              05) expected=5806fea63b9f97906ab3efe1a756fd4a77060e410690a5e2308f120c0a5e050d ;;
              06) expected=c9b26218d0fa20f948b3358c93c5fd003bb40dc57fd0564dc49212380de9c652 ;;
              07) expected=3252de99f4c05208695c0c7dc3a0e03d70a4ec4d4f6e59b1eb5e9889bb5c1ca6 ;;
              08) expected=870446957215985d94092400b586d04a064da081927b8ae26e74d0b251ced490 ;;
              09) expected=d43bcbe9cd97be10f0b082401da4e5efe4d728da4e912596b291f86d6abd0817 ;;
              10) expected=3be9c6f707dd194e324a4a5aca13997570ea8bf6983378f9b85ab84efd4a9737 ;;
              11) expected=54fac33e2416f7862cf7e2010dd405a5820a5bdfc05f80e636bf6284c0b86465 ;;
              12) expected=376e5255e761268e5415af659b5088693292c50b36251d1bc43a636b3bd9c06d ;;
              13) expected=af941af23152053f5a7c94381c3e4cfe1f29165352852d1df7e1cd38ce175e61 ;;
              14) expected=159ac179c333f481a3621fbe443307df2e1c542ef560f2a3fe1a3acd1eb4a6cc ;;
              15) expected=da29d2d8ec7f6d1502d96c876fcc079fe2f5338ed9e5140356c30c1d6161e90d ;;
              16) expected=baae192d6151a427a10c4a07a275d60bf31298c58ebccc7c788a8c57db67558b ;;
            esac
            git show "origin/csi-publisher-20260729-v2:.csi-publisher/v2/part.${part}" | tr -d '\r\n' > "/tmp/csi-part.${part}"
            if [ "$part" = "03" ]; then
              sed -i 's/RWweetNKdy/RWmeetNKdy/' "/tmp/csi-part.${part}"
            fi
            actual="$(sha256sum "/tmp/csi-part.${part}" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "CSI chunk ${part} mismatch: expected=${expected} actual=${actual} bytes=$(wc -c < "/tmp/csi-part.${part}")"
              failed=1
            fi
            cat "/tmp/csi-part.${part}" >> /tmp/csi-patches.b64
          done
          test "$failed" -eq 0
          test "$(wc -c < /tmp/csi-patches.b64)" -eq 68032
          echo "c51b36bfedb4becd9d3f7efbc559e1bdaff6b8f5b1c02149d629d7835c0c782c  /tmp/csi-patches.b64" | sha256sum -c -
          base64 -d /tmp/csi-patches.b64 > /tmp/csi-patches.tar.gz
          echo "a18b420ba57ab57ea7eb47ad51f391077658bc53f82ce249ee186b63f487be9c  /tmp/csi-patches.tar.gz" | sha256sum -c -

          rm -rf /tmp/csi-patches
          mkdir -p /tmp/csi-patches
          tar -xzf /tmp/csi-patches.tar.gz -C /tmp/csi-patches
          test "$(find /tmp/csi-patches -maxdepth 1 -name '*.patch' | wc -l)" -eq 10
          git am /tmp/csi-patches/*.patch

          mapfile -t stages < <(git rev-list --reverse "$base"..HEAD)
          test "${#stages[@]}" -eq 10

          python3 - <<'PY'
          from pathlib import Path

          migration = Path('src/config/migration.go')
          text = migration.read_text()
          if '"reflect"' not in text:
              text = text.replace('"path/filepath"\n\t"strings"', '"path/filepath"\n\t"reflect"\n\t"strings"')
          text = text.replace('if c.System.Classifier.Runtime == (ClassifierRuntimeConfig{}) {', 'if reflect.DeepEqual(c.System.Classifier.Runtime, ClassifierRuntimeConfig{}) {')
          migration.write_text(text)

          tests = Path('src/config/migration_ppe_product_test.go')
          tests.write_text(tests.read_text().replace('migratePPEProductDefaults(cfg)', 'migratePPEProductDefaults(&cfg)'))

          runtime_test = Path('src/http/handler/runtime_control_test.go')
          runtime_test.write_text(runtime_test.read_text().replace('candidate.System.Classifier.Confidence.Mutate++', 'candidate.System.Classifier.Runtime.Confidence.Mutate++'))
          PY
          gofmt -w src/config/migration.go src/config/migration_ppe_product_test.go src/http/handler/runtime_control_test.go
          git add src/config/migration.go src/config/migration_ppe_product_test.go src/http/handler/runtime_control_test.go
          git commit --fixup="${stages[0]}"

          python3 - <<'PY'
          from pathlib import Path

          monitor = Path('src/nfq/canary_monitor.go')
          text = monitor.read_text()
          text = text.replace('IsTCPPort(int) bool', 'IsTCPPort(uint16) bool')
          text = text.replace('IsUDPPort(int) bool', 'IsUDPPort(uint16) bool')
          text = text.replace('ports.IsTCPPort(sport)', 'ports.IsTCPPort(uint16(sport))')
          text = text.replace('ports.IsUDPPort(sport)', 'ports.IsUDPPort(uint16(sport))')
          monitor.write_text(text)

          worker = Path('src/nfq/candidate_worker.go')
          text = worker.read_text()
          text = text.replace('sport := int(binary.BigEndian.Uint16(pkt.raw[pkt.ihl : pkt.ihl+2]))', 'sport := binary.BigEndian.Uint16(pkt.raw[pkt.ihl : pkt.ihl+2])')
          text = text.replace('dport := int(binary.BigEndian.Uint16(pkt.raw[pkt.ihl+2 : pkt.ihl+4]))', 'dport := binary.BigEndian.Uint16(pkt.raw[pkt.ihl+2 : pkt.ihl+4])')
          worker.write_text(text)

          methods = Path('src/config/methods.go')
          text = methods.read_text()
          if 'func (cfg *Config) IsUDPPort(port uint16) bool' not in text:
              anchor = '''func (cfg *Config) IsTCPPort(port uint16) bool {
          \tif cfg.tcpPortMap == nil {
          \t\treturn port == 443
          \t}
          \treturn cfg.tcpPortMap[port]
          }
          '''
              addition = anchor + '''
          // IsUDPPort checks if a port is in the configured UDP port set. The canary
          // monitor uses this on a bounded candidate queue, so deriving from the
          // normalized configured ranges avoids a second mutable runtime index.
          func (cfg *Config) IsUDPPort(port uint16) bool {
          \tif cfg == nil {
          \t\treturn port == 443
          \t}
          \tfor _, value := range cfg.CollectUDPPorts() {
          \t\tif portRange, ok := parsePortRangeStr(value); ok && port >= portRange.Min && port <= portRange.Max {
          \t\t\treturn true
          \t\t}
          \t}
          \treturn false
          }
          '''
              if anchor not in text:
                  raise SystemExit('IsTCPPort anchor not found')
              text = text.replace(anchor, addition)
          methods.write_text(text)

          canary_test = Path('src/nfq/canary_monitor_test.go')
          text = canary_test.read_text().replace('IsTCPPort(port int) bool', 'IsTCPPort(port uint16) bool').replace('IsUDPPort(port int) bool', 'IsUDPPort(port uint16) bool')
          canary_test.write_text(text)
          PY
          gofmt -w src/config/methods.go src/nfq/canary_monitor.go src/nfq/candidate_worker.go src/nfq/canary_monitor_test.go
          git add src/config/methods.go src/nfq/canary_monitor.go src/nfq/candidate_worker.go src/nfq/canary_monitor_test.go
          git commit --fixup="${stages[1]}"

          python3 - <<'PY'
          from pathlib import Path

          visibility = Path('src/nfq/tcp_reassembly_visibility_test.go')
          visibility.write_text(visibility.read_text().replace('github.com/daniellavrushin/b4/classifier/fixtures', 'github.com/daniellavrushin/b4/fixtures'))

          handler = Path('src/nfq/handler.go')
          text = handler.read_text()
          if 'github.com/daniellavrushin/b4/diagnostics' not in text:
              text = text.replace('"github.com/daniellavrushin/b4/config"\n', '"github.com/daniellavrushin/b4/config"\n\t"github.com/daniellavrushin/b4/diagnostics"\n')
          if 'github.com/daniellavrushin/b4/observability' not in text:
              text = text.replace('"github.com/daniellavrushin/b4/metrics"\n', '"github.com/daniellavrushin/b4/metrics"\n\t"github.com/daniellavrushin/b4/observability"\n')
          handler.write_text(text)

          hold = Path('src/nfq/tcp_hold_worker.go')
          text = hold.read_text()
          if 'github.com/daniellavrushin/b4/log' not in text:
              text = text.replace('"github.com/daniellavrushin/b4/config"\n', '"github.com/daniellavrushin/b4/config"\n\t"github.com/daniellavrushin/b4/log"\n')
          hold.write_text(text)

          hold_test = Path('src/nfq/tcp_hold_visibility_test.go')
          hold_test.write_text(hold_test.read_text().replace('Protocol: 6', 'Proto: 6'))
          PY
          gofmt -w src/nfq/handler.go src/nfq/tcp_reassembly_visibility_test.go src/nfq/tcp_hold_worker.go src/nfq/tcp_hold_visibility_test.go
          git add src/nfq/handler.go src/nfq/tcp_reassembly_visibility_test.go src/nfq/tcp_hold_worker.go src/nfq/tcp_hold_visibility_test.go
          git commit --fixup="${stages[2]}"

          python3 - <<'PY'
          from pathlib import Path

          test = Path('src/runtimecontrol/rollout_staged_test.go')
          text = test.read_text()
          old = '''\tclk := clock.NewFixed(time.Unix(100, 0))
          \tstore := &commitFailStore{}
          \tmanager, err := NewManager(builder, Options{Enabled: true, Clock: clk, LastGood: store})
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tprevious := &fakeRuntime{readiness: RuntimeReadiness{Ready: true}, canary: validOutcome()}
          \tif err := manager.InstallInitial(testConfig(false), previous); err != nil {
          \t\tt.Fatal(err)
          \t}
          '''
          new = '''\tmanager, previous, _, _ := testManager(t, builder, Options{})
          \tstore := &commitFailStore{}
          \tmanager.store = store
          '''
          if old not in text:
              raise SystemExit('commit failure test anchor not found')
          test.write_text(text.replace(old, new))
          PY
          gofmt -w src/runtimecontrol/rollout_staged_test.go
          git add src/runtimecontrol/rollout_staged_test.go
          git commit --fixup="${stages[9]}"

          GIT_SEQUENCE_EDITOR=: git rebase -i --autosquash "$base"
          test "$(git rev-list --count "$base"..HEAD)" -eq 10
          git diff --check "$base"..HEAD
          unformatted="$(git diff --name-only "$base"..HEAD -- '*.go' | xargs -r gofmt -l)"
          test -z "$unformatted" || { printf 'Unformatted Go files:\n%s\n' "$unformatted"; exit 1; }

          cd src
          go test ./config ./classifier ./action ./routing ./crossservice ./http/handler ./nfq ./sni ./observability ./diagnostics ./runtimecontrol
          cd ..

          git push origin HEAD:agent/classifier-v2.3-capture-envelope
