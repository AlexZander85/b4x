name: AFS One-shot Gofmt Fix

on:
  push:
    branches:
      - agent/afs-addendum-v1

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: agent/afs-addendum-v1
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Format AFS changed Go files
        run: |
          git fetch origin agent/classifier-v2.3-capture-envelope
          files=$(git diff --name-only origin/agent/classifier-v2.3-capture-envelope...HEAD -- 'src/*.go' 'src/**/*.go' | grep -E '^src/(config|detector|discovery|runtimecontrol)/.*\.go$' || true)
          if [ -z "$files" ]; then
            exit 0
          fi
          gofmt -w $files
          if git diff --quiet -- $files; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "style(afs): gofmt changed Go files"
          git push origin HEAD:agent/afs-addendum-v1
