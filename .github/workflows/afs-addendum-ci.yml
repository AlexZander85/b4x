name: AFS Addendum CI

on:
  pull_request:
    branches:
      - agent/classifier-v2.3-capture-envelope
    paths:
      - "src/config/**"
      - "src/detector/**"
      - "src/discovery/**"
      - "src/runtimecontrol/**"
      - ".github/workflows/afs-addendum-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-go-tests:
    name: Focused Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Gofmt check for PR changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/*.go' 'src/**/*.go' | grep -E '^src/(config|detector|discovery|runtimecontrol)/.*\.go$' || true)
          else
            files=$(git ls-files 'src/config/*.go' 'src/detector/*.go' 'src/discovery/*.go' 'src/runtimecontrol/*.go')
          fi
          if [ -z "$files" ]; then
            exit 0
          fi
          bad=$(gofmt -l $files)
          if [ -n "$bad" ]; then
            echo "Changed files requiring gofmt:"
            echo "$bad"
            exit 1
          fi

      - name: Test AFS-affected packages
        working-directory: src
        run: go test ./config ./detector ./discovery ./runtimecontrol
