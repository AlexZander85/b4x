name: AFS Addendum CI

on:
  pull_request:
    branches:
      - agent/classifier-v2.3-capture-envelope
    paths:
      - "src/config/**"
      - "src/detector/**"
      - "src/discovery/**"
      - "src/monitor/**"
      - "src/observability/**"
      - "src/runtimecontrol/**"
      - "src/validation/**"
      - "src/http/ui/**"
      - ".github/workflows/afs-addendum-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-go-tests:
    name: Focused Go and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Gofmt changed AFS Go files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/*.go' 'src/**/*.go' | grep -E '^src/(config|detector|discovery|monitor|observability|runtimecontrol|validation)/.*\.go$' || true)
          else
            files=$(git diff --name-only origin/agent/classifier-v2.3-capture-envelope...HEAD -- 'src/*.go' 'src/**/*.go' | grep -E '^src/(config|detector|discovery|monitor|observability|runtimecontrol|validation)/.*\.go$' || true)
          fi
          if [ -z "$files" ]; then
            exit 0
          fi
          gofmt -w $files
          if git diff --quiet -- $files; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "chore(afs): gofmt changed files"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Verify changed AFS Go files are formatted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD -- 'src/*.go' 'src/**/*.go' | grep -E '^src/(config|detector|discovery|monitor|observability|runtimecontrol|validation)/.*\.go$' || true)
          else
            files=$(git diff --name-only origin/agent/classifier-v2.3-capture-envelope...HEAD -- 'src/*.go' 'src/**/*.go' | grep -E '^src/(config|detector|discovery|monitor|observability|runtimecontrol|validation)/.*\.go$' || true)
          fi
          if [ -z "$files" ]; then
            exit 0
          fi
          bad=$(gofmt -l $files)
          if [ -n "$bad" ]; then
            echo "Changed files requiring gofmt:"
            echo "$bad"
            exit 1
          fi

      - name: Test AFS-affected packages
        working-directory: src
        run: go test ./config ./detector ./discovery ./monitor ./observability ./runtimecontrol ./validation

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: src/http/ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: src/http/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
