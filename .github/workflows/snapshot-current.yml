name: Snapshot current hardening target

on:
  pull_request:
    branches:
      - hardening-snapshot-h5
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/classifier-v2.3-capture-envelope
          fetch-depth: 0
      - name: Pack repository
        run: tar --exclude='./.git/objects/pack/*.pack' -czf /tmp/current-hardening.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-hardening-repository
          path: /tmp/current-hardening.tar.gz
          retention-days: 1
